server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Increase body size for file uploads
    client_max_body_size 50M;

    # 1. API Calls -> Python Backend
    # The Frontend calls /api/register-customer
    # Nginx passes this to backend:8000/api/register-customer
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. WAHA Dashboard -> /dashboard/
    # Access the WAHA UI via https://domain.com/dashboard/
    location /dashboard {
        proxy_pass http://waha:3000/dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
    
    # WAHA API (Internal usage or direct check)
    location /waha-api/ {
        proxy_pass http://waha:3000/api/;
    }

    # 3. Frontend Assets (React)
    # Default catch-all for the React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}